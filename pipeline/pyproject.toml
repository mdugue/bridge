[project]
name = "bridge-bake"
version = "0.1.0"
description = "The offline geodata bakes: provider downloads -> the per-tile artifacts under data/"
requires-python = ">=3.12,<3.14"
dependencies = [
  "laspy[lazrs]==2.7.0",
  "networkx==3.7",
  "numpy==2.5.4",
  "onnxruntime==1.31.1",
  "pillow==13.0.0",
  "pyogrio==0.13.0",
  "pyproj==3.8.0",
  "rasterio==1.5.2",
  "scikit-image==0.26.0",
  "scipy==1.18.1",
  "shapely==2.2.0",
  "tokenizers==0.23.3",
  "zipfile-deflate64==0.2.0",
]

[dependency-groups]
dev = ["pyright[nodejs]==1.1.414", "pytest==9.2.0", "ruff==0.17.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
# A glob that finds nothing fails the run instead of skipping it, silently
# green (the committed-markings test once globbed a moved folder for a week).
empty_parameter_set_mark = "fail_at_collect"

# The type checker over the bakes (plan 089). Its findings are held to
# typecheck-baseline.json by typecheck.py, which only lets them shrink and
# fails on any other setting here (SETTINGS there). The tests are not checked
# yet: the bakes first. The platform is pinned: on Windows the count differs. Not under bake/, and in the dev
# group, so neither the settings nor the pin re-key a step
# (step_cache.code_hash, step_cache.locked_runtime).
[tool.pyright]
include = ["bake"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
stubPath = "typings"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
