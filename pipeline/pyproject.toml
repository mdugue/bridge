[project]
name = "bridge-bake"
version = "0.1.0"
description = "The offline geodata bakes: provider downloads -> the per-tile artifacts under data/"
requires-python = ">=3.12,<3.14"
dependencies = [
  "laspy[lazrs]==2.7.0",
  "numpy==2.3.3",
  "pillow==11.3.0",
  "pyogrio==0.11.1",
  "pyproj==3.7.2",
  "rasterio==1.4.3",
  "scikit-image==0.26.0",
  "scipy==1.18.1",
  "shapely==2.1.2",
  "zipfile-deflate64==0.2.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.16.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
# A glob that finds nothing fails the run instead of skipping it, silently
# green (the committed-markings test once globbed a moved folder for a week).
empty_parameter_set_mark = "fail_at_collect"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
