name: Plates

# The compared plates, tier 1 (plan 087, ADR 0018): the QA views that hold
# on the runner's software renderer, rendered for the pull request's base
# and for its head by this one runner, and diffed (scripts/plates.ts). A
# tripwire for a change nobody meant: it says *changed*, never *good* —
# SwiftShader's light, shadow and anti-aliasing are not a visitor's. No
# reference image is stored; a faster or slower runner, or a browser bump,
# moves both sides alike.
#
# What it sees is narrow, and it is no review of a look: eight of the 50
# QA views, all on the spawn tile, in the `lite` profile at 400 × 250
# drawn pixels (scripts/plates.ts, `TIER1_VIEWS`). The other 42 views,
# every other tile, the full profile's shadows, AO and resolution, the
# data layers and a view's page query are tier 2's.
#
# Built as the rewrite series' scaffolding (plan 087), kept until the
# maintainer decides otherwise: it runs where a pull request carries the
# label `plates`, or by hand — not on every pull request. A differing view fails the job; the summary
# names it, and the pull request's `## Snapshots` says whether it was meant.

on:
  pull_request:
    types: [labeled, synchronize]
  # By hand, a branch's tip against main's tip (not its merge base: the
  # clone is shallow, so what landed on main since counts too).
  workflow_dispatch:

concurrency:
  group: plates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tier1:
    name: Plates (tier 1, software renderer)
    # Branches of this repository only, never a fork's code: the same job
    # is to run on a machine with a GPU one day (tier 2).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'plates'))
    runs-on: ubuntu-latest
    # Measured on this runner, 2026-11-16 (plan 087, Findings): 16 min
    # 17 s with the base's bake warm; the base bakes cold since, which
    # adds the reference site's bake. A view that will not settle fails
    # by its name after three minutes and a side's render after ten
    # (e2e/snapshot-shot.spec.ts), so a hung run ends with its summary
    # inside this budget, not by being cancelled.
    timeout-minutes: 30
    steps:
      # A pull request's checkout is its merge with the base's tip, so the
      # base's tip against HEAD is exactly what the pull request changes.
      - uses: actions/checkout@v7
      - name: Runner CPU
        run: lscpu | grep -E '^(Model name|CPU\(s\)):'
      - name: Fetch the base commit
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin main
            BASE_SHA=$(git rev-parse FETCH_HEAD)
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The caches the e2e shards restore (ci.yml explains their keys);
      # this job saves none. The head's build starts from the bake cache;
      # the base's bakes cold into its own (scripts/plates.ts says why).
      - uses: actions/cache/restore@v6
        with:
          path: .cache/prepare-data
          key: prepare-data-${{ runner.os }}-${{ hashFiles('data/**', 'scripts/**', 'lib/**', 'sites/**', 'patches/**', 'bun.lock') }}
          restore-keys: |
            prepare-data-${{ runner.os }}-
      - uses: actions/cache/restore@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-plates
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-
      - uses: actions/cache/restore@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright's headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --only-shell chromium
      # Builds the head here and the base in a worktree (plates/src/), each
      # with the debug hook and the reference site alone, serves each and
      # renders it with the head's harness.
      - name: Render the base and the head, and compare
        run: bun run plates -- --base "$BASE_SHA" --summary "$GITHUB_STEP_SUMMARY"
        env:
          SHOTS_SMALL: "1"
          BASE_SHA: ${{ steps.base.outputs.sha }}
      # Base, head and difference image of each differing view, and the
      # report; every plate of both sides beside them.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plates-report
          path: |
            plates/report/
            plates/tier1/
          retention-days: 7
