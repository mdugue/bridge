name: Plates

# The compared plates, tier 1 (plan 087, ADR 0018): the QA views that hold
# on the runner's software renderer, rendered for the pull request's base
# and for its head by this one runner, and diffed (scripts/plates.ts). A
# tripwire for a change nobody meant: it says *changed*, never *good* —
# SwiftShader's light, shadow and anti-aliasing are not a visitor's. No
# reference image is stored; a faster or slower runner, or a browser bump,
# moves both sides alike.
#
# What it sees is narrow, and it is no review of a look: eight of the 50
# QA views, all on the spawn tile, in the `lite` profile at 400 × 250
# drawn pixels (scripts/plates.ts, `TIER1_VIEWS`). The other 42 views,
# every other tile, the full profile's shadows, AO and resolution, the
# data layers and a view's page query are tier 2's.
#
# A pull request names the views it means to change under a `## Snapshots`
# section of its description: those are reported. A differing view that
# is not named there fails the job, with or without the section. Not a
# required check.

on:
  pull_request:
    # Not while a draft: the job renders for a quarter of an hour, and a
    # draft is pushed to often. Marking it ready runs it.
    types: [opened, synchronize, reopened, ready_for_review]
    # What can move a pixel: the viewer, what it is built and baked from,
    # the views and the harness itself.
    paths:
      - app/**
      - components/**
      - hooks/**
      - lib/**
      - public/**
      - types/**
      - scripts/**
      - data/**
      - sites/**
      - patches/**
      - qa/views/**
      - e2e/snapshot-shot.spec.ts
      - e2e/swiftshader-webgpu.ts
      - playwright.config.ts
      - next.config.ts
      - package.json
      - bun.lock
      - .github/workflows/plates.yml
  # By hand, a branch's tip against main's tip (not its merge base: the
  # clone is shallow, so what landed on main since counts too).
  workflow_dispatch:
    inputs:
      claims:
        description: The views the branch means to change, comma-separated (reported, not failed)
        type: string
        default: ""
      pairs:
        description: Instead, measure this runner's noise floor over so many same-commit pairs (0 = compare)
        type: number
        default: 0

concurrency:
  group: plates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  tier1:
    name: Plates (tier 1, software renderer)
    # Branches of this repository only, never a fork's code: the same job
    # is to run on a machine with a GPU one day (tier 2).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    # Measured on this runner, 2026-11-16 (plan 087, Findings): 16 min
    # 17 s with the base's bake warm; the base bakes cold since, which
    # adds the reference site's bake. A view that will not settle fails
    # by its name after three minutes and a side's render after ten
    # (e2e/snapshot-shot.spec.ts), so a hung run ends with its summary
    # inside this budget, not by being cancelled.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.pairs > 0 && 180 || 30 }}
    steps:
      # A pull request's checkout is its merge with the base's tip, so the
      # base's tip against HEAD is exactly what the pull request changes.
      - uses: actions/checkout@v7
      - name: Runner CPU
        run: lscpu | grep -E '^(Model name|CPU\(s\)):'
      - name: Fetch the base commit
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin main
            BASE_SHA=$(git rev-parse FETCH_HEAD)
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
      # The description as it is now, not as the event carried it: a re-run
      # after naming a view passes. Its text is only read for view names
      # (scripts/plates.ts, `claimedViews`).
      - name: Read the pull request's description
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CLAIMS: ${{ inputs.claims }}
        run: |
          mkdir -p plates
          if [ -n "$PR" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.body // ""' > plates/description.md
            echo "flags=--claims-file plates/description.md" >> "$GITHUB_OUTPUT"
          elif [ -n "$CLAIMS" ]; then
            printf '## Snapshots\n%s\n' "$CLAIMS" | tr ',' ' ' > plates/description.md
            echo "flags=--claims-file plates/description.md" >> "$GITHUB_OUTPUT"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The caches the e2e shards restore (ci.yml explains their keys);
      # this job saves none. The head's build starts from the bake cache;
      # the base's bakes cold into its own (scripts/plates.ts says why).
      - uses: actions/cache/restore@v6
        with:
          path: .cache/prepare-data
          key: prepare-data-${{ runner.os }}-${{ hashFiles('data/**', 'scripts/**', 'lib/**', 'sites/**', 'patches/**', 'bun.lock') }}
          restore-keys: |
            prepare-data-${{ runner.os }}-
      - uses: actions/cache/restore@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-plates
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-
      - uses: actions/cache/restore@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright's headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --only-shell chromium
      # Builds the head here and the base in a worktree (plates/src/), each
      # with the debug hook and the reference site alone, serves each and
      # renders it with the head's harness.
      - name: Render the base and the head, and compare
        if: github.event_name != 'workflow_dispatch' || inputs.pairs == 0
        run: bun run plates -- --base "$BASE_SHA" --summary "$GITHUB_STEP_SUMMARY" $CLAIM_FLAGS
        env:
          SHOTS_SMALL: "1"
          BASE_SHA: ${{ steps.base.outputs.sha }}
          CLAIM_FLAGS: ${{ steps.claim.outputs.flags }}
      # Plan 087's gate for this tier, on the runner it runs on: n + 1
      # renders of the head, every pair of neighbours compared. Eleven
      # renders took an hour in the cloud container, hence the budget.
      - name: Measure the noise floor
        if: github.event_name == 'workflow_dispatch' && inputs.pairs > 0
        timeout-minutes: 170
        run: bun run plates -- pairs "$PAIRS" --summary "$GITHUB_STEP_SUMMARY"
        env:
          SHOTS_SMALL: "1"
          PAIRS: ${{ inputs.pairs }}
      # Base, head and difference image of each differing view, and the
      # report; every plate of both sides beside them.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plates-report
          path: |
            plates/report/
            plates/tier1/
          retention-days: 7
