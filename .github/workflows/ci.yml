name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-flight CI run when new commits land on the same ref. PR pushes
# are the common case; the queued run is almost always stale by the time it
# starts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun typecheck

  unit:
    name: Unit (bun test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test

  # The offline bakes (pipeline/, Python in its own uv environment): their
  # unit tests and ruff. The bakes themselves need the raw downloads and run
  # on the maintainer's machine (bun run bake), never here.
  pipeline:
    name: Pipeline (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest -q tests
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # Build and e2e share ONE job. They used to be two, each doing its own
  # `next build` on its own runner — the same work billed twice. This job's
  # build step is the build check; the Playwright step then serves the artifact
  # it just produced instead of rebuilding inside `webServer`.
  e2e:
    # Name kept as-is: it is the status check PRs are gated on. (The separate
    # "Build" check is gone — drop it from branch protection if it is required.)
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # The viewer specs drive the real scene through software-rendered WebGL,
    # one worker at a time (see playwright.config.ts). The `lite` scene profile
    # keeps that to a few minutes, but a shared runner is about half the speed
    # of a developer machine, so leave headroom: a tight budget cancels the job
    # mid-run and reports nothing at all, which is worse than a slow job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # One extra commit, not the whole history: the repo carries ~130 MB of
      # committed geodata, so a deep clone is not free.
      - name: Fetch the PR base commit
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # The e2e half is skipped on PRs that cannot affect it (docs, the
      # offline pipeline, this workflow). scripts/, data/, sites/ and patches/
      # do: the tileset the viewer streams is baked from them at build time.
      # The job itself always runs and always builds, so the status check stays green
      # rather than "skipped" — which branch protection would treat as never
      # reported.
      - name: Decide whether the e2e half has to run
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request — running the full suite."
            exit 0
          fi
          # Two-dot diff: with a shallow base there is no merge base to walk.
          # It over-reports (changes that landed on main since the PR branched
          # count too), which errs towards running the suite.
          if git diff --name-only "$BASE_SHA" HEAD -- \
              app components hooks lib e2e public types scripts data sites patches \
              playwright.config.ts next.config.ts tsconfig.json postcss.config.mjs \
              package.json bun.lock \
              | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No viewer-facing changes — building only."
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Cache the Next.js .next/cache between runs — speeds up incremental
      # builds substantially for repeated PR pushes.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-
      # NEXT_PUBLIC_POC_DEBUG exposes the window.__poc hook the specs drive. It
      # is a single inlined constant, so this still exercises the real
      # production build path; a deploy builds without it and ships no hook.
      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_POC_DEBUG: "1"
          NEXT_TELEMETRY_DISABLED: "1"
      # Cache the Playwright browser binaries — ~150 MB to install otherwise.
      - uses: actions/cache@v6
        if: steps.scope.outputs.run == 'true'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright browsers
        if: steps.scope.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install OS deps only
        if: steps.scope.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - name: Run Playwright tests
        if: steps.scope.outputs.run == 'true'
        run: bun run test:e2e
        env:
          CI: "1"
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Upload HTML report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload traces / failure artifacts
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
