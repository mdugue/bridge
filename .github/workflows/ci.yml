name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-flight CI run when new commits land on the same ref. PR pushes
# are the common case; the queued run is almost always stale by the time it
# starts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun typecheck

  unit:
    name: Unit (bun test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test

  # The offline bakes (pipeline/, Python in its own uv environment): their
  # unit tests and ruff. The bakes themselves need the raw downloads and run
  # on the maintainer's machine (bun run bake), never here.
  pipeline:
    name: Pipeline (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest -q tests
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # Build and e2e share a job: its build step is the build check, and the
  # Playwright step serves the artifact it just produced instead of
  # rebuilding inside `webServer`. The suite is split over two runners that
  # run side by side — the desktop viewer's shared boot and its tests (tagged
  # `@desktop` in e2e/city-walk.spec.ts) on one, everything else on the
  # other: SwiftShader is CPU-bound, so a second Playwright worker on the same
  # runner only halves both pages' frame rates, while a second runner halves
  # the wall-clock time. Each shard builds for itself; with the caches below
  # that is well under a minute.
  e2e:
    name: E2E (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    # The viewer specs drive the real scene through software-rendered WebGL,
    # one worker at a time (see playwright.config.ts). A shared runner is
    # about half the speed of a developer machine, so leave headroom: a tight
    # budget cancels the job mid-run and reports nothing at all, which is
    # worse than a slow job.
    timeout-minutes: 20
    strategy:
      # One shard failing must not cancel the other's report.
      fail-fast: false
      matrix:
        shard:
          - name: desktop
            args: --grep @desktop
            # The build check proper: builds even when the e2e half is skipped.
            buildCheck: true
          - name: shell, phone, whole site, docs
            args: --grep-invert @desktop
            buildCheck: false
    steps:
      - uses: actions/checkout@v7
      # One extra commit, not the whole history: the repo carries ~130 MB of
      # committed geodata, so a deep clone is not free.
      - name: Fetch the PR base commit
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # The e2e half is skipped on PRs that cannot affect it (docs, the
      # offline pipeline, this workflow). scripts/, data/, sites/ and patches/
      # do: the tileset the viewer streams is baked from them at build time.
      # The desktop shard always runs and always builds, so the status check
      # stays green rather than "skipped" — which branch protection would
      # treat as never reported.
      - name: Decide whether the e2e half has to run
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request — running the full suite."
            exit 0
          fi
          # Two-dot diff: with a shallow base there is no merge base to walk.
          # It over-reports (changes that landed on main since the PR branched
          # count too), which errs towards running the suite.
          if git diff --name-only "$BASE_SHA" HEAD -- \
              app components hooks lib e2e public types scripts data sites patches \
              playwright.config.ts next.config.ts tsconfig.json postcss.config.mjs \
              package.json bun.lock \
              | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No viewer-facing changes — building only."
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.scope.outputs.run == 'true' || matrix.shard.buildCheck
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        if: steps.scope.outputs.run == 'true' || matrix.shard.buildCheck
      # The tile bake's own cache (scripts/prepare-data.ts): cold, the bake
      # takes ~90 s here; warm, about a second. Any earlier entry is a sound
      # start — the bake keys every artifact by the contents of its inputs and
      # of every module it imports, and re-bakes only what changed — so the
      # key only decides when a new entry is saved.
      - uses: actions/cache@v6
        if: steps.scope.outputs.run == 'true' || matrix.shard.buildCheck
        with:
          path: .cache/prepare-data
          key: prepare-data-${{ runner.os }}-${{ hashFiles('data/**', 'scripts/**', 'lib/**', 'sites/**', 'patches/**', 'bun.lock') }}
          restore-keys: |
            prepare-data-${{ runner.os }}-
      # Cache the Next.js .next/cache (Turbopack's) between runs — speeds up
      # incremental builds for repeated PR pushes.
      - uses: actions/cache@v6
        if: steps.scope.outputs.run == 'true' || matrix.shard.buildCheck
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-
      # NEXT_PUBLIC_POC_DEBUG exposes the window.__poc hook the specs drive. It
      # is a single inlined constant, so this still exercises the real
      # production build path; a deploy builds without it and ships no hook.
      - name: Build
        if: steps.scope.outputs.run == 'true' || matrix.shard.buildCheck
        run: bun run build
        env:
          NEXT_PUBLIC_POC_DEBUG: "1"
          NEXT_TELEMETRY_DISABLED: "1"
      # Headless runs use Chromium's headless shell, never the full browser:
      # installing the shell alone keeps the cached download to a third.
      - uses: actions/cache@v6
        if: steps.scope.outputs.run == 'true'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright browsers
        if: steps.scope.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps --only-shell chromium
      - name: Install OS deps only
        if: steps.scope.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - name: Run Playwright tests
        if: steps.scope.outputs.run == 'true'
        run: bun run test:e2e ${{ matrix.shard.args }}
        env:
          CI: "1"
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Upload HTML report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7
      - name: Upload traces / failure artifacts
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  # The status check PRs are gated on keeps its name and reports both shards
  # as one. It runs whenever the shards ran, so a failed (or timed-out) shard
  # fails it instead of leaving it "skipped" — which branch protection would
  # treat as never reported.
  e2e-result:
    name: E2E (Playwright)
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Both shards passed
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.e2e.result }}
