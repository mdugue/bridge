version: 2
updates:
  # bun.lock + package.json — Dependabot reads npm-style manifests regardless
  # of which install tool the project uses.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: [next, "@next/*", eslint-config-next]
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      tailwind:
        patterns: [tailwindcss, "@tailwindcss/*", tw-animate-css]
      shadcn:
        patterns: [shadcn, "@base-ui/*"]
      lint-and-format:
        patterns: [eslint, eslint-*, biome, "@biomejs/*", ultracite]
      # The three.js stack moves as one: postprocessing caps `three`, and
      # n8ao / three-mesh-bvh / the CityJSON loader all peer on it, so a solo
      # bump is either unmergeable or a silent version skew.
      three:
        patterns:
          - three
          - "@types/three"
          - three-mesh-bvh
          - postprocessing
          - n8ao
          - cityjson-threejs-loader
      types:
        patterns: ["@types/*"]
        exclude-patterns: ["@types/react*", "@types/three"]

  # Keep Actions fresh (the Bun version comes from package.json's
  # `packageManager` field, not from the setup-bun pin).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
