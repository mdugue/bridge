version: 2
updates:
  # bun.lock + package.json — Dependabot reads npm-style manifests regardless
  # of which install tool the project uses.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Superseded PRs still occupy a slot until a maintainer closes them, so a
    # tight cap lets one stale major starve every other group. 10 keeps the
    # grouped updates flowing while the queue drains.
    open-pull-requests-limit: 10
    groups:
      next:
        patterns: [next, "@next/*"]
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      tailwind:
        patterns: [tailwindcss, "@tailwindcss/*", tw-animate-css]
      shadcn:
        patterns: [shadcn, "@base-ui/*"]
      lint-and-format:
        # oxlint declares a `>=` peer on oxlint-tsgolint: bump them together.
        patterns: [oxlint, oxfmt, oxlint-tsgolint]
      # The three.js stack moves as one: three-mesh-bvh, the CityJSON loader
      # and 3d-tiles-renderer all peer on `three`, so a solo bump is a silent
      # version skew.
      three:
        patterns:
          - three
          - "@types/three"
          - three-mesh-bvh
          - 3d-tiles-renderer
          - cityjson-threejs-loader
      types:
        patterns: ["@types/*"]
        exclude-patterns: ["@types/react*", "@types/three"]

  # Keep Actions fresh (the Bun version comes from package.json's
  # `packageManager` field, not from the setup-bun pin).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  # pipeline/uv.lock — the offline bakes' Python environment.
  - package-ecosystem: uv
    directory: /pipeline
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
